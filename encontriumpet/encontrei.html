<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThorMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="encontrei.css">
    
</head>
<body>
    <div id="encontrei-page" class="container my-5">
    <div class="card shadow p-4">
    

        <h2 class="text-center mb-3">🐾 Encontrei um Pet</h2>
        <p class="text-center text-muted">
            Ajude esse pet a encontrar seu dono 💛
        </p>

        <form id="form-encontrei">

            <div class="mb-3">
                <label class="form-label">Nome do pet (se souber)</label>
                <input type="text" class="form-control" placeholder="Ex: Thor">
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo de animal</label>
                <select class="form-select">
                    <option>Cachorro</option>
                    <option>Gato</option>
                    <option>Outro</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Local onde encontrou</label>
                <input type="text" class="form-control" placeholder="Ex: Zona Leste - SP">
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" rows="3" placeholder="Cor, tamanho, comportamento..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Foto do pet</label>
                <input type="file" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Cadastrar Pet
            </button>

        </form>

        <button id="voltar-menu" class="btn btn-outline-secondary mt-3">
            Voltar
        </button>

    </div>
</div>
</body>
</html>
